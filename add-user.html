<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إضافة مستخدم جديد</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <h1>إضافة مستخدم جديد</h1>
            <nav>
                <a href="#" id="href-main" onclick="redirect('href-main'); return false;">→ العودة للرئيسية</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="login-container" style="max-width:600px;">
            <h2>بيانات المستخدم</h2>

            <div class="input-group">
                <label>الاسم الكامل:</label>
                <input id="name" type="text">
            </div>

            <div class="input-group">
                <label>البريد الإلكتروني:</label>
                <input id="email" type="email">
            </div>

            <div class="input-group">
                <label>كلمة المرور:</label>
                <input id="password" type="text">
            </div>

            <!-- روابط المستخدم -->
            <div class="input-group">
                <label>روابط المستخدم:</label>

                <div id="links-container"></div>

                <button type="button" class="btn" style="margin-top:10px;" onclick="addLinkField()">
                    + إضافة رابط
                </button>
            </div>

            <!-- المدير المباشر -->
            <div class="input-group">
                <label>المدير المباشر:</label>
                <select id="manager"></select>
            </div>

            <!-- الصلاحية -->
            <div class="input-group">
                <label>الصلاحية:</label>
                <select id="role">
                    <option value="no">User</option>
                    <option value="yes">Admin</option>
                </select>
            </div>

            <button type="submit" onclick="addUser()">إضافة المستخدم</button>

            <p id="msg" class="form-message"></p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
