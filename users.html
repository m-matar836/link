<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة المستخدمين</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>
<header class="main-header">
    <div class="container">
        <h1>إدارة المستخدمين</h1>
        <nav>
            <a href="admin.html">→ العودة للوحة التحكم</a>
        </nav>
    </div>
</header>

<main class="container">

    <div class="login-container" style="max-width:900px;">

        <h2>قائمة المستخدمين</h2>

        <button class="btn" style="margin-bottom:20px;" onclick="window.location.href='add-user.html'">
            + إضافة مستخدم جديد
        </button>

        <input type="text" id="search" placeholder="ابحث عن مستخدم أو مدير…" 
               style="width:100%; padding:12px; margin-bottom:20px; border-radius:6px; border:1px solid #ccc;"
               onkeyup="searchUsers()">

        <table id="users-table" style="width:100%; border-collapse:collapse;">
            <thead>
                <tr style="background:#3498db; color:white;">
                    <th style="padding:10px; width:20%;">الاسم</th>
                    <th style="padding:10px; width:20%;">الإيميل</th>
                    <th style="padding:10px; width:20%;">المدير</th>
                    <th style="padding:10px; width:10%;">الصلاحية</th>
                    <th style="padding:10px; width:10%;">روابط</th>
                    <th style="padding:10px; width:10%;">تعديل</th>
                    <th style="padding:10px; width:10%;">حذف</th>
                </tr>
            </thead>
            <tbody id="users-body"></tbody>
        </table>

    </div>

</main>

<script src="script.js"></script>

</body>
</html>
